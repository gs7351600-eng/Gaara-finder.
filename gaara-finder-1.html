<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gaara Finder</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#1a1a2e; display:flex; justify-content:center; align-items:flex-start; min-height:100vh; font-family:'Rajdhani',sans-serif; }
  .window { background:#1e1e1e; width:100%; max-width:560px; min-height:100vh; display:flex; flex-direction:column; }

  /* TITLEBAR */
  .titlebar { background:#252525; display:flex; align-items:center; justify-content:space-between; padding:10px 14px; border-bottom:1px solid #333; flex-shrink:0; }
  .titlebar-left { display:flex; align-items:center; gap:8px; }
  .title-icon { width:22px; height:22px; background:linear-gradient(135deg,#f5a623,#e67e22); border-radius:5px; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; color:#fff; }
  .title-text { font-family:'Share Tech Mono',monospace; font-size:13px; color:#ddd; letter-spacing:2px; text-transform:uppercase; }
  .badge-online { background:#1a3d1a; border:1px solid #2ecc71; color:#2ecc71; font-size:10px; font-family:'Share Tech Mono',monospace; padding:2px 8px; border-radius:20px; display:flex; align-items:center; gap:4px; }
  .badge-online::before { content:''; width:6px; height:6px; background:#2ecc71; border-radius:50%; animation:pulse 1.5s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
  .close-btn { width:18px; height:18px; background:#c0392b; border-radius:50%; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:10px; color:rgba(255,255,255,0.6); }

  .body { display:flex; flex:1; overflow:hidden; }

  /* SIDEBAR */
  .sidebar { width:110px; background:#1a1a1a; border-right:1px solid #2e2e2e; padding:8px 0; flex-shrink:0; display:flex; flex-direction:column; }
  .sidebar-item { padding:10px 10px; font-size:13px; color:#888; cursor:pointer; display:flex; align-items:center; gap:6px; transition:all 0.15s; border-left:3px solid transparent; position:relative; }
  .sidebar-item.active { background:#252525; color:#fff; border-left-color:#f5a623; }
  .sidebar-item:hover:not(.active) { background:#222; color:#aaa; }
  .notif-badge { position:absolute; right:8px; top:50%; transform:translateY(-50%); background:#e74c3c; color:#fff; font-size:9px; font-family:'Share Tech Mono',monospace; border-radius:10px; padding:1px 5px; display:none; }
  .notif-badge.show { display:block; }
  .sidebar-bottom { padding:10px 10px; border-top:1px solid #2e2e2e; margin-top:auto; }
  .sync-info { display:flex; align-items:center; gap:6px; }
  .sync-avatar { width:26px; height:26px; background:linear-gradient(135deg,#f5a623,#e67e22); border-radius:6px; display:flex; align-items:center; justify-content:center; font-size:11px; color:#fff; font-weight:700; flex-shrink:0; }
  .sync-label { font-size:10px; color:#666; font-family:'Share Tech Mono',monospace; }
  .sync-date { font-size:8px; color:#444; font-family:'Share Tech Mono',monospace; margin-top:1px; }

  /* PANELS */
  .main { flex:1; background:#1e1e1e; overflow:hidden; display:flex; flex-direction:column; }
  .panel { display:none; padding:10px; flex:1; flex-direction:column; overflow:hidden; }
  .panel.active { display:flex; }

  /* JOINER FEED */
  .joiner-wrap { display:flex; flex-direction:column; flex:1; overflow:hidden; gap:6px; }
  .joiner-feed-header { display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
  .joiner-feed-title { font-family:'Share Tech Mono',monospace; font-size:10px; color:#f5a623; letter-spacing:1px; text-transform:uppercase; }

  .alert-feed { flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:6px; }
  .alert-feed::-webkit-scrollbar { width:3px; }
  .alert-feed::-webkit-scrollbar-thumb { background:#333; border-radius:4px; }

  /* card estilo Discord embed */
  .alert-card { background:#2a2a2a; border-radius:8px; overflow:hidden; border-left:4px solid #555; animation:slideIn 0.2s ease; }
  .alert-card.ultra { border-left-color:#e74c3c; }
  .alert-card.high  { border-left-color:#f5a623; }
  .alert-card.mid   { border-left-color:#3498db; }
  @keyframes slideIn { from{opacity:0;transform:translateY(-5px)} to{opacity:1;transform:translateY(0)} }

  .alert-inner { display:flex; gap:8px; padding:8px 10px; }
  .alert-content { flex:1; min-width:0; }
  .alert-title { font-size:14px; font-weight:700; color:#fff; margin-bottom:3px; line-height:1.3; }
  .alert-value { font-family:'Share Tech Mono',monospace; font-size:11px; color:#2ecc71; margin-bottom:5px; }
  .brainrots-label { font-family:'Share Tech Mono',monospace; font-size:9px; color:#888; margin-bottom:3px; text-transform:uppercase; letter-spacing:1px; }
  .brainrots-list { background:#1e1e1e; border-radius:4px; padding:5px 7px; font-family:'Share Tech Mono',monospace; font-size:10px; color:#bbb; line-height:1.7; }
  .alert-footer { font-family:'Share Tech Mono',monospace; font-size:9px; color:#555; margin-top:5px; }
  .alert-thumb { width:54px; height:54px; border-radius:6px; object-fit:cover; flex-shrink:0; background:#333; align-self:flex-start; }
  .alert-thumb-placeholder { width:54px; height:54px; border-radius:6px; flex-shrink:0; background:#2e2e2e; display:flex; align-items:center; justify-content:center; font-size:22px; align-self:flex-start; }

  .tier-badge { display:inline-block; font-size:9px; font-weight:700; font-family:'Share Tech Mono',monospace; padding:1px 5px; border-radius:3px; text-transform:uppercase; margin-right:5px; vertical-align:middle; }
  .tier-badge.ultra{background:rgba(231,76,60,0.2);color:#e74c3c;}
  .tier-badge.high {background:rgba(245,166,35,0.2);color:#f5a623;}
  .tier-badge.mid  {background:rgba(52,152,219,0.2);color:#3498db;}

  .feed-empty { display:flex; flex-direction:column; align-items:center; justify-content:center; flex:1; gap:6px; }
  .feed-empty-icon { font-size:28px; opacity:0.3; }
  .feed-empty-text { font-family:'Share Tech Mono',monospace; font-size:10px; color:#444; text-align:center; line-height:1.6; }

  .status-bar { display:flex; align-items:center; gap:5px; flex-shrink:0; }
  .status-dot { width:5px; height:5px; border-radius:50%; background:#555; flex-shrink:0; }
  .status-dot.loading{background:#f5a623;animation:pulse 1s infinite;}
  .status-dot.ok {background:#2ecc71;}
  .status-dot.err{background:#e74c3c;}
  .status-text { font-family:'Share Tech Mono',monospace; font-size:9px; color:#555; }

  /* CONFIG */
  .notifs-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; flex-shrink:0; }
  .notifs-title { font-family:'Share Tech Mono',monospace; font-size:11px; color:#888; letter-spacing:1px; text-transform:uppercase; }
  .channels-config { display:flex; flex-direction:column; gap:5px; margin-bottom:8px; flex-shrink:0; }
  .channel-row { display:flex; align-items:center; gap:5px; }
  .channel-label { font-family:'Share Tech Mono',monospace; font-size:9px; font-weight:700; padding:2px 6px; border-radius:4px; white-space:nowrap; flex-shrink:0; width:52px; text-align:center; }
  .channel-label.ultra { background:rgba(231,76,60,0.2); color:#e74c3c; border:1px solid rgba(231,76,60,0.3); }
  .channel-label.high  { background:rgba(245,166,35,0.2); color:#f5a623; border:1px solid rgba(245,166,35,0.3); }
  .channel-label.mid   { background:rgba(52,152,219,0.2); color:#3498db; border:1px solid rgba(52,152,219,0.3); }
  .channel-label.token { background:rgba(155,89,182,0.2); color:#9b59b6; border:1px solid rgba(155,89,182,0.3); }
  .txt-input { flex:1; background:#252525; border:1px solid #333; border-radius:5px; color:#ccc; font-family:'Share Tech Mono',monospace; font-size:9px; padding:5px 8px; outline:none; transition:border-color 0.15s; min-width:0; }
  .txt-input:focus { border-color:#f5a623; }
  .txt-input::placeholder { color:#3a3a3a; }
  .dot-ok  { width:7px; height:7px; border-radius:50%; background:#2ecc71; flex-shrink:0; }
  .dot-off { width:7px; height:7px; border-radius:50%; background:#333; flex-shrink:0; }
  .btn-save-all { background:linear-gradient(135deg,#f5a623,#e67e22); border:none; border-radius:6px; color:#fff; font-family:'Rajdhani',sans-serif; font-size:12px; font-weight:700; padding:6px 0; cursor:pointer; width:100%; margin-bottom:6px; flex-shrink:0; }

  .btn-sm { background:#252525; border:1px solid #333; border-radius:5px; color:#aaa; font-size:10px; font-family:'Share Tech Mono',monospace; padding:3px 8px; cursor:pointer; }
  .btn-sm.danger { background:#2a1515; border-color:#552222; color:#e74c3c; }

  .placeholder-panel { display:flex; align-items:center; justify-content:center; height:100%; color:#444; font-family:'Share Tech Mono',monospace; font-size:11px; }

  /* FOOTER */
  .footer { display:flex; align-items:center; justify-content:space-between; padding:8px 10px; border-top:1px solid #2a2a2a; background:#1a1a1a; flex-shrink:0; }
  .btn-join-server { background:linear-gradient(135deg,#2ecc71,#27ae60); border:none; border-radius:6px; color:#fff; font-family:'Rajdhani',sans-serif; font-size:13px; font-weight:700; letter-spacing:1px; padding:7px 18px; cursor:pointer; }
  .btn-auto { background:#3d1a1a; border:1px solid #c0392b; border-radius:6px; color:#e74c3c; font-family:'Share Tech Mono',monospace; font-size:10px; padding:6px 12px; cursor:pointer; }
</style>
</head>
<body>
<div class="window">
  <div class="titlebar">
    <div class="titlebar-left">
      <div class="title-icon">G</div>
      <span class="title-text">GAARA FINDER</span>
      <div class="badge-online">Online</div>
    </div>
    <div class="close-btn">✕</div>
  </div>

  <div class="body">
    <div class="sidebar">
      <div class="sidebar-item active" onclick="switchTab('joiner',this)"><span>🔗</span> Joiner</div>
      <div class="sidebar-item" onclick="switchTab('config',this)">
        <span>⚙️</span> Config
        <span class="notif-badge" id="notifBadge">0</span>
      </div>
      <div class="sidebar-item" onclick="switchTab('setting',this)"><span>📋</span> Setting</div>
      <div class="sidebar-item" onclick="switchTab('misc',this)"><span>📄</span> Misc</div>
      <div class="sidebar-bottom">
        <div class="sync-info">
          <div class="sync-avatar">G</div>
          <div>
            <div class="sync-label">Gaara</div>
            <div class="sync-date">Apr 2025</div>
          </div>
        </div>
      </div>
    </div>

    <div class="main">

      <!-- JOINER: feed de alertas ao vivo -->
      <div class="panel active" id="panel-joiner">
        <div class="joiner-wrap">
          <div class="joiner-feed-header">
            <span class="joiner-feed-title">🔔 Alertas ao Vivo</span>
            <div style="display:flex;gap:5px;">
              <button class="btn-sm" onclick="fetchAll()">↻ Att</button>
              <button class="btn-sm danger" onclick="clearFeed()">🗑</button>
            </div>
          </div>

          <div class="alert-feed" id="alertFeed">
            <div class="feed-empty" id="emptyState">
              <div class="feed-empty-icon">🔕</div>
              <div class="feed-empty-text">Nenhum alerta ainda<br>Configure os canais na aba Config</div>
            </div>
          </div>

          <div class="status-bar">
            <div class="status-dot" id="statusDot"></div>
            <span class="status-text" id="statusText">Aguardando configuração...</span>
          </div>
        </div>
      </div>

      <!-- CONFIG -->
      <div class="panel" id="panel-config">
        <div class="notifs-header">
          <span class="notifs-title">⚙️ Configuração</span>
        </div>
        <div class="channels-config">
          <div class="channel-row">
            <span class="channel-label ultra">ULTRA</span>
            <input class="txt-input" id="chUltra" type="text" placeholder="Channel ID — UltraLights (1B+)" />
            <div class="dot-off" id="dotUltra"></div>
          </div>
          <div class="channel-row">
            <span class="channel-label high">HIGH</span>
            <input class="txt-input" id="chHigh" type="text" placeholder="Channel ID — HighLights (100M+)" />
            <div class="dot-off" id="dotHigh"></div>
          </div>
          <div class="channel-row">
            <span class="channel-label mid">MID</span>
            <input class="txt-input" id="chMid" type="text" placeholder="Channel ID — MidLights" />
            <div class="dot-off" id="dotMid"></div>
          </div>
          <div class="channel-row">
            <span class="channel-label token">TOKEN</span>
            <input class="txt-input" id="botToken" type="password" placeholder="Bot Token do Discord" />
            <div class="dot-off" id="dotToken"></div>
          </div>
        </div>
        <button class="btn-save-all" onclick="saveAll()">💾 Salvar e Conectar</button>
      </div>

      <!-- SETTING -->
      <div class="panel" id="panel-setting">
        <div class="placeholder-panel">📋 &nbsp; EM BREVE</div>
      </div>

      <!-- MISC -->
      <div class="panel" id="panel-misc">
        <div class="placeholder-panel">📄 &nbsp; EM BREVE</div>
      </div>
    </div>
  </div>

  <div class="footer">
    <button class="btn-join-server">Join Server</button>
    <button class="btn-auto" id="autoBtn" onclick="toggleAuto()">⏸ Auto Joiner Inactive</button>
  </div>
</div>

<script>
  function switchTab(name, el) {
    document.querySelectorAll('.sidebar-item').forEach(i => i.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    el.classList.add('active');
    document.getElementById('panel-' + name).classList.add('active');
    if (name === 'joiner') {
      unreadCount = 0;
      document.getElementById('notifBadge').classList.remove('show');
    }
  }

  let autoActive = false;
  function toggleAuto() {
    autoActive = !autoActive;
    const btn = document.getElementById('autoBtn');
    btn.textContent   = autoActive ? '▶ Auto Joiner Active' : '⏸ Auto Joiner Inactive';
    btn.style.background  = autoActive ? '#1a3d1a' : '#3d1a1a';
    btn.style.borderColor = autoActive ? '#2ecc71' : '#c0392b';
    btn.style.color       = autoActive ? '#2ecc71' : '#e74c3c';
  }

  const CHANNELS = {
    ultra: { key:'gaaraChUltra', inputId:'chUltra', dotId:'dotUltra', tier:'ultra' },
    high:  { key:'gaaraChHigh',  inputId:'chHigh',  dotId:'dotHigh',  tier:'high'  },
    mid:   { key:'gaaraChMid',   inputId:'chMid',   dotId:'dotMid',   tier:'mid'   },
  };

  let botToken    = localStorage.getItem('gaaraBotToken') || '';
  let unreadCount = 0;
  let pollTimer   = null;
  const seenIds   = new Set();

  Object.values(CHANNELS).forEach(c => {
    const saved = localStorage.getItem(c.key);
    if (saved) { document.getElementById(c.inputId).value = saved; setDot(c.dotId, true); }
  });
  if (botToken) { document.getElementById('botToken').value = '••••••••'; setDot('dotToken', true); }

  if (botToken && Object.values(CHANNELS).some(c => localStorage.getItem(c.key))) {
    setStatus('loading', 'Conectando...');
    setTimeout(fetchAll, 600);
    startPolling();
  }

  function saveAll() {
    const tokenVal = document.getElementById('botToken').value.trim();
    if (tokenVal && tokenVal !== '••••••••') {
      botToken = tokenVal;
      localStorage.setItem('gaaraBotToken', botToken);
      document.getElementById('botToken').value = '••••••••';
      setDot('dotToken', true);
    }
    let anyChannel = false;
    Object.values(CHANNELS).forEach(c => {
      const val = document.getElementById(c.inputId).value.trim();
      if (val) { localStorage.setItem(c.key, val); setDot(c.dotId, true); anyChannel = true; }
    });
    if (!botToken)   { setStatus('err', 'Faltou o Bot Token!'); return; }
    if (!anyChannel) { setStatus('err', 'Coloca pelo menos 1 Channel ID!'); return; }
    setStatus('loading', 'Conectando...');
    seenIds.clear();
    fetchAll();
    startPolling();
    // volta pro Joiner
    document.querySelectorAll('.sidebar-item')[0].click();
  }

  function setDot(id, on) { document.getElementById(id).className = on ? 'dot-ok' : 'dot-off'; }

  function startPolling() {
    if (pollTimer) clearInterval(pollTimer);
    pollTimer = setInterval(fetchAll, 10000);
  }

  async function fetchAll() {
    if (!botToken) return;
    setStatus('loading', 'Atualizando...');
    let anyOk = false, lastErr = '';
    const promises = Object.entries(CHANNELS).map(async ([name, c]) => {
      const chId = localStorage.getItem(c.key);
      if (!chId) return;
      try {
        const apiUrl = `https://discord.com/api/v10/channels/${chId}/messages?limit=10`;
        const proxies = [
          `https://corsproxy.io/?${encodeURIComponent(apiUrl)}`,
          `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(apiUrl)}`,
          `https://thingproxy.freeboard.io/fetch/${apiUrl}`,
        ];
        let res = null, lastProxyErr = '';
        for (const proxy of proxies) {
          try {
            const r = await fetch(proxy, { headers: { 'Authorization': 'Bot ' + botToken } });
            if (r.ok) { res = r; break; }
            lastProxyErr = 'HTTP ' + r.status;
          } catch(pe) { lastProxyErr = pe.message; }
        }
        if (!res) throw new Error(lastProxyErr || 'Todos os proxies falharam');
        const msgs = await res.json();
        processMessages(msgs, c.tier);
        anyOk = true;
      } catch(e) { lastErr = e.message; }
    });
    await Promise.all(promises);
    if (anyOk) setStatus('ok', 'Atualizado ' + new Date().toLocaleTimeString('pt-BR'));
    else       setStatus('err', 'Erro: ' + lastErr);
  }

  function processMessages(msgs, forceTier) {
    if (!Array.isArray(msgs)) return;
    const feed = document.getElementById('alertFeed');
    let added = 0;
    [...msgs].reverse().forEach(msg => {
      if (seenIds.has(msg.id)) return;
      seenIds.add(msg.id);
      const embeds = msg.embeds || [];
      if (embeds.length) {
        embeds.forEach(embed => { feed.appendChild(buildCard(embed, msg.timestamp, forceTier)); added++; });
      } else if (msg.content) {
        feed.appendChild(buildPlainCard(msg.content, msg.timestamp, forceTier)); added++;
      }
    });
    if (added > 0) {
      document.getElementById('emptyState')?.remove();
      feed.scrollTop = feed.scrollHeight;
      const joinerTab = document.querySelectorAll('.sidebar-item')[0];
      if (!joinerTab.classList.contains('active')) {
        unreadCount += added;
        const badge = document.getElementById('notifBadge');
        badge.textContent = unreadCount > 9 ? '9+' : unreadCount;
        badge.classList.add('show');
      }
    }
  }

  function buildCard(embed, timestamp, tier) {
    const title  = embed.title || 'Notificação';
    const ts     = timestamp ? new Date(timestamp).toLocaleTimeString('pt-BR') : '';
    const valueMatch = title.match(/\(([^)]+\/s)\)/);
    const value      = valueMatch ? valueMatch[1] : '';
    const cleanName  = title.replace(/^\d+x\s*/, '').replace(/\([^)]+\/s\)/, '').trim();
    const imgUrl     = embed.thumbnail?.url || embed.image?.url || '';
    const desc       = (embed.description || '').trim();
    const footer     = embed.footer?.text || '';

    const card = document.createElement('div');
    card.className = `alert-card ${tier}`;

    const brainrotsHtml = desc
      ? `<div class="brainrots-label">Brainrots:</div>
         <div class="brainrots-list">${desc.replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>')}</div>`
      : '';

    const thumbHtml = imgUrl
      ? `<img class="alert-thumb" src="${imgUrl}" onerror="this.style.display='none'">`
      : `<div class="alert-thumb-placeholder">🎮</div>`;

    card.innerHTML = `
      <div class="alert-inner">
        <div class="alert-content">
          <div class="alert-title"><span class="tier-badge ${tier}">${tier.toUpperCase()}</span>${cleanName}</div>
          ${value ? `<div class="alert-value">💰 ${value}</div>` : ''}
          ${brainrotsHtml}
          <div class="alert-footer">${footer || ts}</div>
        </div>
        ${thumbHtml}
      </div>`;
    return card;
  }

  function buildPlainCard(content, timestamp, tier) {
    const ts = timestamp ? new Date(timestamp).toLocaleTimeString('pt-BR') : '';
    const card = document.createElement('div');
    card.className = `alert-card ${tier}`;
    card.innerHTML = `
      <div class="alert-inner">
        <div class="alert-content">
          <div class="alert-title"><span class="tier-badge ${tier}">${tier.toUpperCase()}</span>${content.slice(0,100)}</div>
          <div class="alert-footer">${ts}</div>
        </div>
      </div>`;
    return card;
  }

  function clearFeed() {
    const feed = document.getElementById('alertFeed');
    feed.innerHTML = `<div class="feed-empty" id="emptyState">
      <div class="feed-empty-icon">🔕</div>
      <div class="feed-empty-text">Feed limpo</div>
    </div>`;
    seenIds.clear();
    unreadCount = 0;
    document.getElementById('notifBadge').classList.remove('show');
  }

  function setStatus(type, msg) {
    document.getElementById('statusDot').className = 'status-dot ' + type;
    document.getElementById('statusText').textContent = msg;
  }
</script>
</body>
</html>
